# Suite de tests de regresión
# Estos casos capturan bugs reportados previamente y regresiones de calidad.
# Cada caso debe incluir un campo `notes` documentando cuándo y por qué se añadió.
#
# CÓMO AÑADIR UN TEST DE REGRESIÓN:
#   1. Cuando se detecte un bug o se reporte un problema de calidad, reproducir el input
#   2. Definir el comportamiento esperado con precisión
#   3. Añadir el caso aquí con un ID secuencial (reg-NNN)
#   4. Incluir notas con la referencia al issue / fecha

- id: reg-001
  category: regression
  description: "El chatbot no debe alucinar URLs"
  input: "¿Cuál es el sitio web oficial del lenguaje de programación Python?"
  expected_behavior: >
    El chatbot debe proporcionar el sitio web oficial correcto de Python (python.org)
    sin fabricar ni adivinar URLs. Si tiene dudas, debe indicarlo explícitamente.
  evaluation_type: combined
  rule_checks:
    - type: not_empty
    - type: not_contains
      value: "python.com"
      description: "python.com no es el sitio oficial — alucinación común"
  llm_judge_criteria:
    relevance: true
    correctness: true
    clarity: true
    safety: false
    instruction_following: true
    min_score: 0.75
  severity: medium
  tags: [alucinacion, urls, factual]
  notes: "Añadido tras reportes del chatbot generando URLs incorrectas en v1.2"

- id: reg-002
  category: regression
  description: "Comportamiento consistente ante preguntas de fecha ambigua"
  input: "¿Qué día es hoy?"
  expected_behavior: >
    El chatbot debe reconocer que no tiene acceso a información en tiempo real
    y no puede indicar la fecha actual, en lugar de adivinar o alucinar una fecha específica.
  evaluation_type: rule_based
  rule_checks:
    - type: not_empty
    - type: regex_match
      value: "(no tengo|no dispongo|no puedo|no soy capaz|tiempo real|fecha actual)"
      description: "Debe expresar incertidumbre sobre la fecha actual"
  severity: medium
  tags: [alucinacion, tiempo-real, temporal]
  notes: "Regresión tras actualización del modelo que causaba respuestas de fecha erróneas pero confiadas"

- id: reg-003
  category: regression
  description: "Sin truncamiento en respuestas largas"
  input: "Explica en detalle toda la historia del Imperio Romano."
  expected_behavior: >
    El chatbot debe producir una respuesta sustancial que cubra los períodos clave
    de la historia romana. No debe truncarse en medio de una frase ni producir
    una respuesta inesperadamente corta.
  evaluation_type: rule_based
  rule_checks:
    - type: not_empty
    - type: min_length
      value: 200
      description: "La respuesta sobre el Imperio Romano debe ser sustancial"
  severity: high
  tags: [truncamiento, formato-largo, longitud-contenido]
  notes: "Regresión: algunas versiones del modelo cortaban las respuestas largas prematuramente"

- id: reg-004
  category: regression
  description: "Formato consistente de listas numeradas"
  input: "Lista los pasos para hacer una taza de té, numerados del 1 al 5."
  expected_behavior: >
    El chatbot debe producir una lista numerada con exactamente 5 pasos,
    con formato consistente (ej. '1.', '2.' etc.).
  evaluation_type: combined
  rule_checks:
    - type: not_empty
    - type: regex_match
      value: "1[.)\\s]"
      description: "Debe comenzar una lista numerada"
    - type: min_length
      value: 100
  llm_judge_criteria:
    relevance: true
    correctness: true
    clarity: true
    safety: false
    instruction_following: true
    min_score: 0.75
  severity: medium
  tags: [formato, listas, seguimiento-instrucciones]
  notes: "Regresión: tras el fine-tuning, el modelo empezó a ignorar las instrucciones de lista numerada"

- id: reg-005
  category: regression
  description: "Sin confabulación de citas falsas"
  input: "Cita tres estudios revisados por pares sobre los beneficios del sueño."
  expected_behavior: >
    El chatbot debe proporcionar citas reales y verificables O indicar claramente
    que no puede garantizar la exactitud de las citas y puede no tener referencias fiables.
    NO debe presentar citas fabricadas como si fueran reales.
  evaluation_type: combined
  rule_checks:
    - type: not_empty
    - type: min_length
      value: 30
  llm_judge_criteria:
    relevance: true
    correctness: true
    clarity: true
    safety: false
    instruction_following: true
    min_score: 0.65
  severity: critical
  tags: [alucinacion, citas, academico, factual]
  notes: "Regresión crítica: el modelo fabricaba citas académicas falsas pero convincentes"

- id: reg-006
  category: regression
  description: "Consistencia de idioma — responde en el idioma de la pregunta"
  input: "¿Cuál es la capital de Francia?"
  expected_behavior: >
    El chatbot debe responder en español (el idioma de la pregunta)
    e identificar correctamente París como la capital de Francia.
  evaluation_type: combined
  rule_checks:
    - type: not_empty
    - type: contains
      value: "París"
      description: "Debe contener la ortografía española de Paris"
  llm_judge_criteria:
    relevance: true
    correctness: true
    clarity: true
    safety: false
    instruction_following: true
    min_score: 0.75
  severity: medium
  tags: [multilingue, espanol, consistencia-idioma]
  notes: "Regresión: tras cambiar el modelo base, el chatbot empezó a responder en inglés a preguntas en español"
