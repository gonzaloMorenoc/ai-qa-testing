# Configuración del chatbot-qa-framework
# Sobreescribe cualquier valor con variables de entorno (ver config.py para los nombres de variables).

provider:
  # Proveedor del chatbot: 'mock' | 'openai' | 'claude'
  # Sobreescribir con env: CHATBOT_PROVIDER
  name: mock

  # Identificador del modelo (específico del proveedor)
  # Sobreescribir con env: CHATBOT_MODEL
  # Ejemplos: 'gpt-4o', 'claude-sonnet-4-6', 'gpt-3.5-turbo'
  model: null

  # API key — preferiblemente usar la variable de entorno CHATBOT_API_KEY en lugar de guardarlo aquí
  api_key: null

  # Opcional: sobreescribir la URL base de la API (para endpoints compatibles con OpenAI, Azure, etc.)
  base_url: null

  # Tiempo límite de la solicitud en segundos
  timeout_s: 30.0

  # Número de reintentos ante fallos transitorios
  max_retries: 2

llm_judge:
  # Establecer en false para desactivar la evaluación LLM-as-judge completamente (más rápido, sin conexión)
  enabled: true

  # Proveedor usado para el juicio — puede diferir del proveedor del chatbot
  # Sobreescribir con env: LLM_JUDGE_PROVIDER
  provider: mock

  # Modelo para el juez (ej. 'gpt-4o' para juicios de mayor calidad)
  # Sobreescribir con env: LLM_JUDGE_MODEL
  model: null

  # Sobreescribir con env: LLM_JUDGE_API_KEY
  api_key: null

  timeout_s: 60.0

runner:
  # Directorio que contiene los archivos de dataset JSONL/YAML
  datasets_dir: datasets

  # Limitar la ejecución a categorías específicas (lista vacía = ejecutar todas)
  # Ejemplo: ['functional', 'safety']
  categories: []

  # Detener la ejecución tras el primer fallo
  fail_fast: false

  # Omitir casos de prueba que producen errores del proveedor (en lugar de contarlos como fallos)
  skip_on_error: true

report:
  # Directorio donde se escribirán los reportes
  output_dir: reports

  # Activar/desactivar formatos de reporte
  json_enabled: true
  markdown_enabled: true

  # Incluir salidas completas del chatbot en los reportes (desactivar para reducir el tamaño)
  include_full_outputs: true
